name: "Publish to npm"
on:
  # Releases created by hand in the GitHub UI
  release:
    types: [released]
  # Releases created by build_weekly.yml. Those use GITHUB_TOKEN, which doesn't
  # trigger other workflows, so build_weekly.yml calls this one directly.
  workflow_call:
    inputs:
      ref:
        description: 'Tag or branch to publish'
        required: true
        type: string
jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # "ref" specifies the branch to check out.
          # inputs.ref is set when called from build_weekly.yml; otherwise
          # "github.event.release.target_commitish" is the branch the release targeted
          ref: ${{ inputs.ref || github.event.release.target_commitish }}
      - name: Use Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/ # Specifies the registry, this field is required!
      - run: npm ci
      # Forks only do a dry run so they can't publish the real package
      - run: npm publish ${{ github.repository != 'devicons/devicon' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
