name: Build Icons (Emergency Fallback)

# Manual emergency re-run for when the nightly build fails or needs to be
# forced outside the regular schedule. Commits font files directly to master
# with a "build:" prefix so build_nightly.yml doesn't double-process.
#
# For day-to-day releases, use build_nightly.yml instead.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build (for audit trail)'
        required: false
        default: 'Manual emergency build'

permissions:
  contents: write

jobs:
  build:
    name: Emergency Build — Fonts + CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./.github/scripts/requirements.txt
          npm install

      - name: Run Icomoon build
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ./.github/scripts/icomoon_build.py \
            ./.github/scripts/build_assets/geckodriver-v0.32.2-linux64/geckodriver \
            ./icomoon.json \
            ./devicon.json \
            ./icons \
            ./ \
            $GITHUB_TOKEN \
            --headless

      - name: Build devicon.min.css
        run: npm run build-css

      - name: Upload geckodriver.log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: geckodriver-log
          path: ./geckodriver.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logfile
          path: ./log.txt

      - name: Commit build artifacts directly to master
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "build: emergency font rebuild

Reason: ${{ inputs.reason }}

Generated with [Claude Code](https://claude.com/claude-code)

Co-Authored-By: Claude <noreply@anthropic.com>"
            git push
          else
            echo "No changes to commit"
          fi
