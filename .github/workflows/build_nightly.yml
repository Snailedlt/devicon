name: Weekly Build and Release
# Runs every Monday at 2 AM UTC, or manually via workflow_dispatch

on:
  schedule:
    - cron: '0 2 * * 1'  # 2 AM UTC every Monday
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level (auto = derive from PR labels)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build and Stage Release
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
      bump: ${{ steps.version-bump.outputs.bump }}
      build_ok: ${{ steps.build-result.outputs.build_ok }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check for new icon commits since last build
        id: check-changes
        run: |
          # Find the last commit whose message starts with "build:"
          LAST_BUILD=$(git log --format="%H %s" | awk '/^[a-f0-9]+ build:/ { print $1; exit }')

          if [ -z "$LAST_BUILD" ]; then
            echo "No previous build commit found - falling back to last release tag"
            LAST_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | head -1)
            if [ -z "$LAST_TAG" ]; then
              echo "No release tag found either - checking all history"
              RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
            else
              echo "Using last release tag as base: $LAST_TAG"
              RANGE="${LAST_TAG}..HEAD"
            fi
          else
            echo "Last build commit: $LAST_BUILD"
            RANGE="${LAST_BUILD}..HEAD"
          fi

          # Check if any commits in range touch icons/ or devicon.json
          CHANGES=$(git diff --name-only $RANGE -- icons/ devicon.json 2>/dev/null)

          if [ -z "$CHANGES" ]; then
            echo "No icon changes since last build — skipping"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Icon changes found since last build"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "range=$RANGE" >> $GITHUB_OUTPUT
          fi

      - name: Determine version bump level
        if: steps.check-changes.outputs.has_changes == 'true'
        id: version-bump
        uses: actions/github-script@v7
        with:
          script: |
            const manualBump = '${{ inputs.bump }}';
            if (manualBump && manualBump !== 'auto') {
              console.log('Manual bump override:', manualBump);
              core.setOutput('bump', manualBump);
              return;
            }

            const range = '${{ steps.check-changes.outputs.range }}';
            const { execSync } = require('child_process');

            // Get commit messages in range that touch icon files
            let log = '';
            try {
              log = execSync(`git log --format="%s" ${range} -- icons/ devicon.json`).toString().trim();
            } catch (e) {
              console.log('Could not get git log:', e.message);
            }

            if (!log) {
              console.log('No matching commits found, defaulting to patch');
              core.setOutput('bump', 'patch');
              return;
            }

            // Extract PR numbers from squash commit messages like "new icon: foo (#123)"
            const prNumbers = [...log.matchAll(/\(#(\d+)\)/g)].map(m => parseInt(m[1]));
            console.log('PR numbers found in commits:', prNumbers);

            let bump = 'patch';

            for (const prNumber of prNumbers) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });

                const labels = pr.labels.map(l => l.name);
                console.log(`PR #${prNumber} labels:`, labels);

                if (labels.includes('release: major')) {
                  bump = 'major';
                  break; // Can't go higher
                } else if (labels.includes('release: minor') && bump !== 'major') {
                  bump = 'minor';
                }
              } catch (e) {
                console.log(`Could not fetch PR #${prNumber}:`, e.message);
              }
            }

            console.log('Final version bump:', bump);
            core.setOutput('bump', bump);

      - name: Setup Python 3.10
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r ./.github/scripts/requirements.txt

      - name: Install Node dependencies
        if: steps.check-changes.outputs.has_changes == 'true'
        run: npm install

      - name: Install Firefox
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: browser-actions/setup-firefox@v1

      - name: Make geckodriver executable
        if: steps.check-changes.outputs.has_changes == 'true'
        run: chmod +x ./.github/scripts/build_assets/geckodriver-v0.32.2-linux64/geckodriver

      - name: Run Icomoon build
        if: steps.check-changes.outputs.has_changes == 'true'
        id: build
        continue-on-error: true
        run: |
          python ./.github/scripts/icomoon_build_githubless.py \
            ./.github/scripts/build_assets/geckodriver-v0.32.2-linux64/geckodriver \
            ./icomoon.json \
            ./devicon.json \
            ./icons \
            ./ \
            --headless

      - name: Build CSS
        if: steps.check-changes.outputs.has_changes == 'true' && steps.build.outcome == 'success'
        id: build-css
        continue-on-error: true
        run: npm run build-css

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always() && steps.check-changes.outputs.has_changes == 'true'
        with:
          name: build-log
          path: ./log.txt

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always() && steps.check-changes.outputs.has_changes == 'true'
        with:
          name: build-screenshots
          path: ./screenshots/
          if-no-files-found: ignore

      - name: Upload geckodriver log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: geckodriver-log
          path: ./geckodriver.log

      - name: Handle build failure
        if: steps.check-changes.outputs.has_changes == 'true' && (steps.build.outcome == 'failure' || steps.build-css.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Ensure the build-failed label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'build-failed'
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'build-failed',
                color: 'd73a4a',
                description: 'Weekly build failed'
              });
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly build failed - ${today}`,
              body: `The weekly Icomoon build failed.\n\n**Workflow run:** ${runUrl}\n\nPlease investigate and re-run manually once fixed using the \`workflow_dispatch\` trigger on \`build_nightly.yml\`.`,
              labels: ['build-failed']
            });

            core.setFailed('Weekly build failed - issue created');

      - name: Set build result output
        id: build-result
        if: always()
        run: |
          if [[ "${{ steps.check-changes.outputs.has_changes }}" == "true" && \
                "${{ steps.build.outcome }}" == "success" && \
                "${{ steps.build-css.outcome }}" == "success" ]]; then
            echo "build_ok=true" >> $GITHUB_OUTPUT
          else
            echo "build_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit build artifacts
        if: steps.check-changes.outputs.has_changes == 'true' && steps.build.outcome == 'success' && steps.build-css.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "build: generate font files and CSS"
            git push
          else
            echo "No build artifacts changed"
          fi

  # ── Release gate ─────────────────────────────────────────────────────────────
  # This job requires a manual approval in the "production" GitHub Environment
  # before bumping the version and publishing the release.
  #
  # One-time setup (repo admin):
  #   Settings → Environments → New environment → name it "production"
  #   Add required reviewers (maintainers who should approve releases).
  release:
    name: Bump Version and Release
    needs: build
    # Only run when the build job found icon changes AND succeeded
    if: needs.build.outputs.has_changes == 'true' && needs.build.outputs.build_ok == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Bump version
        id: bump
        run: |
          BUMP="${{ needs.build.outputs.bump }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          npm version $BUMP -m "chore: bump version to %s"
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git push --follow-tags

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.bump.outputs.version }}';
            const bump = '${{ needs.build.outputs.bump }}';

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `Release v${version}`,
              generate_release_notes: true,
              draft: false
            });

            console.log(`Released v${version} (${bump} bump).`);
