name: Peek Icons
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'icons/**'
jobs:
  peek:
    # four outcomes: successful check and upload,
    # unsuccessful check (fail due to user),
    # fail due to system, skipped
    name: Peek Icons
    runs-on: ubuntu-24.04
    steps:
      # Checks out the PR's merge commit; depth 2 so HEAD^1 (the target branch)
      # is available to diff against
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Python v3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./.github/scripts/requirements.txt

      - name: Save the PR number in an artifact
        shell: bash
        env:
          PR_NUM: ${{ github.event.number }}
        run: echo $PR_NUM > pr_num.txt

      - name: Upload the PR number
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr_num
          path: ./pr_num.txt

      - name: Run icomoon_peek.py
        shell: bash
        run: >
          python ./.github/scripts/icomoon_peek.py
          ./.github/scripts/build_assets/geckodriver-v0.32.2-linux64/geckodriver ./icomoon.json
          ./icons ./ --headless

      - name: Upload the err messages (created by icomoon_peek.py)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: err_messages
          path: ./err_messages.txt

      - name: Upload screenshots for comments
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: screenshots
          path: ./screenshots/*.png

      - name: Upload geckodriver.log for debugging purposes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: geckodriver-log
          path: ./geckodriver.log
